services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: berri
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

